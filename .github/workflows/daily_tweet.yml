name: Daily Animal Tweet (Playwright Free Bot)

on:
  schedule:
    # 毎日 日本時間 12:00 (UTC 03:00) に自動実行
    - cron: '0 3 * * *'
  # GitHub画面からの手動実行ボタンを有効化
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv
          playwright install --with-deps chromium

      - name: Run Playwright tweet script
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python scripts/tweet_playwright.py
